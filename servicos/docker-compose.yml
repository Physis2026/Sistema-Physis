# Servidor da Physis — serviços abertos incorporados ao Sistema Physis (docs: physis-hub/docs/SERVICOS_ABERTOS.md)
#
#   cd servicos && ./preparar.sh                  # gera env/*.env com segredos, pastas e senhas do MQTT
#   docker compose --profile hub --profile caddy up -d
#   COMPOSE_PROFILES=hub,caddy,mosquitto,nodered,superset,bi,geoserver,calc,ia docker compose up -d
#
# Regras deste arquivo (conferidas por physis-hub/tests/test_implantacao.py):
# - só o Caddy publica portas; o resto fala por redes internas (internal: true = sem internet);
# - todo serviço tem healthcheck e restart; segredos só em env/*.env (fora do Git);
# - dados em ${PHYSIS_DADOS} (pastas do host: a cópia de segurança do host enxerga tudo).
#
# Redes:
#   publica  — Caddy (80/443) e saída para o Let's Encrypt
#   saida    — saída para a internet SEM porta publicada: hub (clima, e-mail) e GeoServer (WFS em cascata)
#   borda    — Caddy -> hub, Node-RED, Superset, GeoServer (interna, IP fixo do Caddy = proxy confiável do hub)
#   motores  — hub/Node-RED -> calc, documentos (PDF/A) e IA (interna)
#   iot      — Mosquitto <-> hub e Node-RED (interna)
#   dados    — PostGIS <-> exportador, Superset, GeoServer (interna)
#   meta     — Superset <-> banco de metadados (interna)
#   series   — TimescaleDB <-> exportador e Superset (interna)

name: physis

services:

  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: [env/caddy.env]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PHYSIS_DADOS:-/srv/physis}/caddy/data:/data
      - ${PHYSIS_DADOS:-/srv/physis}/caddy/config:/config
    networks:
      publica: {}
      borda:
        ipv4_address: 172.30.10.2
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  hub:
    build:
      context: ./hub
      additional_contexts:
        pacote: ${PHYSIS_PACOTE:-../physis-hub}
    image: physis/hub:local
    profiles: ["hub"]
    restart: unless-stopped
    env_file: [env/hub.env]
    environment:
      PHYSIS_BANCO: /dados/physis-hub.db
      PHYSIS_MAPAS: /dados/mapas
      PHYSIS_ENTREGAS: /dados/entregas
      PHYSIS_EDITAIS_PASTA: /dados/editais
      PHYSIS_ENDERECO: 0.0.0.0
      PHYSIS_PORTA: "8700"
      PHYSIS_PROXY_CONFIAVEL: 172.30.10.2
      PHYSIS_HTTPS: "1"
      PHYSIS_EXPOSTO: "1"
      PHYSIS_MQTT_BROKER: mosquitto
      PHYSIS_MQTT_PORTA: "1883"
      PHYSIS_MQTT_USUARIO: physis-hub
      PHYSIS_CALC_URL: http://calc:8710
      PHYSIS_DOC_URL: http://documentos:8720
      PHYSIS_IA_URL: http://ia:11434
      PHYSIS_IA_TIPO: ollama
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/hub:/dados
      - ${PHYSIS_DADOS:-/srv/physis}/hub-config/instancia.json:/opt/physis/instancia.json:ro
    networks: [borda, saida, motores, iot]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_signal: SIGINT
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/api/instancia', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    profiles: ["mosquitto"]
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ${PHYSIS_DADOS:-/srv/physis}/mosquitto/senhas:/mosquitto/config/senhas:ro
      - ${PHYSIS_DADOS:-/srv/physis}/mosquitto/data:/mosquitto/data
    networks: [iot]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  nodered:
    image: nodered/node-red:4.0.2
    profiles: ["nodered"]
    restart: unless-stopped
    env_file: [env/nodered.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/nodered:/data
      - ./nodered/settings.js:/data/settings.js:ro
    networks: [borda, iot, motores]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  superset-db:
    image: postgres:16.4-alpine
    profiles: ["superset"]
    restart: unless-stopped
    env_file: [env/superset-db.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/superset-db:/var/lib/postgresql/data
    networks: [meta]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:4.0.2
    profiles: ["superset"]
    restart: unless-stopped
    env_file: [env/superset.env]
    command: ["/bin/sh", "/app/iniciar-physis.sh"]
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/iniciar.sh:/app/iniciar-physis.sh:ro
    networks: [borda, meta, dados, series]
    depends_on:
      superset-db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgis:
    image: postgis/postgis:16-3.4-alpine
    profiles: ["bi", "superset", "geoserver"]
    restart: unless-stopped
    env_file: [env/postgis.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/postgis:/var/lib/postgresql/data
      - ./postgis/init:/docker-entrypoint-initdb.d:ro
    networks: [dados]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 5s
      retries: 5

  # Instantâneo do banco do hub (API de backup do SQLite) para o BI. Única peça além do hub que toca o
  # banco vivo; sem rede nenhuma. O exportador só lê o instantâneo (somente leitura).
  instantaneo:
    build: ./exportador
    image: physis/exportador:local
    profiles: ["bi"]
    restart: unless-stopped
    user: "10700:10700"
    command: ["python", "/app/instantaneo.py"]
    env_file: [env/exportador.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/hub:/hub
      - ${PHYSIS_DADOS:-/srv/physis}/instantaneos:/instantaneos
    network_mode: none
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/app/instantaneo.py", "--saude"]
      interval: 5m
      timeout: 10s
      retries: 2

  exportador:
    build: ./exportador
    image: physis/exportador:local
    profiles: ["bi"]
    restart: unless-stopped
    user: "10701:10700"
    command: ["python", "/app/exportar_hub.py"]
    env_file: [env/exportador.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/instantaneos:/instantaneos:ro
      - ${PHYSIS_DADOS:-/srv/physis}/camadas/hub:/saida_geojson
      - ${PHYSIS_DADOS:-/srv/physis}/camadas:/dados/camadas:ro
    networks: [dados, series]
    depends_on:
      postgis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/app/exportar_hub.py", "--saude"]
      interval: 5m
      timeout: 10s
      retries: 2

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    profiles: ["geoserver"]
    restart: unless-stopped
    env_file: [env/geoserver.env]
    environment:
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "false"
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/geoserver:/opt/geoserver_data
      - ${PHYSIS_DADOS:-/srv/physis}/camadas:/dados/camadas:ro
    networks: [borda, dados, saida]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/geoserver/ows?service=WMS&version=1.3.0&request=GetCapabilities' -o /dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s

  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    profiles: ["series"]
    restart: unless-stopped
    env_file: [env/timescale.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/timescale:/var/lib/postgresql/data
      - ./timescale/init:/docker-entrypoint-initdb.d:ro
    networks: [series]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 5s
      retries: 5

  calc:
    build: ./calc
    image: physis/calc:local
    profiles: ["calc"]
    restart: unless-stopped
    env_file: [env/calc.env]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/epw:/dados/epw:ro
    networks: [motores]
    read_only: true
    tmpfs: ["/tmp:size=1g"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8710/saude', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Documentos: LibreOffice headless (ODT/ODS -> PDF/A-2b) e veraPDF (validação). Processo separado do hub
  # (veraPDF é GPLv3+/MPLv2+; nada é ligado ao código do hub). Rede só interna.
  documentos:
    build: ./documentos
    image: physis/documentos:local
    profiles: ["documentos"]
    restart: unless-stopped
    env_file: [env/documentos.env]
    networks: [motores]
    read_only: true
    tmpfs: ["/tmp:size=1g"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8720/saude', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # IA local (lista do Eric, parte G). Rede só interna: nada sai para a internet.
  # Baixar modelos: ver SERVICOS_ABERTOS.md (liga a rede "saida" só durante o "ollama pull").
  ia:
    image: ollama/ollama:0.3.12
    profiles: ["ia"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/ia:/root/.ollama
    networks: [motores]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Placas de vídeo NVIDIA (com nvidia-container-toolkit no host): descomente.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Alternativa à "ia" para GPU com mais memória (API compatível OpenAI; o hub usa PHYSIS_IA_TIPO=openai).
  ia-vllm:
    image: vllm/vllm-openai:v0.6.3
    profiles: ["ia-vllm"]
    restart: unless-stopped
    env_file: [env/ia-vllm.env]
    command: ["--model", "/modelos/atual", "--served-model-name", "physis", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ${PHYSIS_DADOS:-/srv/physis}/ia-vllm:/modelos:ro
    networks: [motores]
    ipc: host
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    # deploy: (igual à "ia", com GPU)

networks:
  publica: {}
  saida: {}
  borda:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  motores:
    internal: true
  iot:
    internal: true
  dados:
    internal: true
  meta:
    internal: true
  series:
    internal: true
