<!-- Programas do PC pela plataforma (25/11/2026): FreeCAD, QGIS/GDAL, Blender, KiCad, PrusaSlicer, LibreCAD, CalculiX, Gmsh,
     Tesseract, RDKit, EnergyPlus, OpenStudio, Elmer, LAMMPS, COPASI, Psi4, OpenSim e serviços. Só a equipe; sem internet. -->
<style>
:root{color-scheme:light;--fundo:#F4F1EA;--sup:#FFFFFF;--texto:#1B1F23;--t2:#4A4F44;--titulo:#33512F;--acao:#0B3D2E;--sobre:#F4F1EA;--linha:#D9D3C2;--erro:#7A2214}
html[data-tema="escuro"]{color-scheme:dark;--fundo:#0B3D2E;--sup:#0F4535;--texto:#F4F1EA;--t2:#C3D0BD;--titulo:#F4F1EA;--acao:#F4F1EA;--sobre:#0B3D2E;--linha:#2F5E4E;--erro:#D9A58C}
*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.5 Georgia,serif}main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-family:Fraunces,Georgia,serif;color:var(--titulo);font-size:1.6rem}h2{color:var(--titulo);font-size:1.15rem;margin:.2em 0}
.cartao{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:14px;margin:10px 0}.t2{color:var(--t2)}
label{display:block;margin:.4em 0 .2em}select,input{min-height:44px;padding:6px;border:1px solid var(--t2);border-radius:8px;background:var(--sup);color:var(--texto);font:inherit;max-width:100%}
.botao{min-height:44px;padding:8px 14px;border-radius:8px;border:2px solid var(--acao);background:var(--acao);color:var(--sobre);font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
:focus-visible{outline:3px solid #C2410C;outline-offset:2px}.erro{color:var(--erro)}pre{white-space:pre-wrap;word-break:break-word;background:var(--fundo);padding:8px;border-radius:8px;max-height:300px;overflow:auto}
.pular{position:absolute;left:-9999px}.pular:focus{left:8px;top:8px;background:var(--sup);padding:8px;z-index:9}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--linha);padding:6px;text-align:left}

<script>(function(){try{var p=JSON.parse(localStorage.getItem("physis-pref")||"{}"),t=p.tema||"automatico";if(t==="automatico")t=matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro";document.documentElement.dataset.tema=t;}catch(e){}})();</script>

<body><a class="pular" href="#principal">Pular para o conteúdo</a>
<div id="pp-lugar" data-physis-preferencias="lugar"></div>
<main id="principal" tabindex="-1">
<h1>Programas do servidor</h1>
<p class="t2">Envie o arquivo: o programa roda no servidor, sem abrir janela, e devolve o resumo e os arquivos gerados. Só programas abertos instalados neste PC.</p>
<section class="cartao"><h2>Rodar</h2><form id="f">
<label for="rec">Receita</label><select id="rec"></select>
<p id="rec-info" class="t2"></p>
<div id="ps"></div>
<label for="arq">Arquivo</label><input id="arq" type="file">
<p><button class="botao" type="submit">Rodar</button></p><p id="msg" role="status" aria-live="polite"></p></form></section>
<section class="cartao"><h2>Trabalhos</h2><div id="trab"><p>Carregando…</p></div></section>
<section class="cartao" id="det" hidden aria-live="polite"></section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id), esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let REC = [], csrf = null;
async function api(u, op) { const r = await fetch(u, Object.assign({ credentials: "same-origin" }, op || {})); let j = {}; try { j = await r.json(); } catch (e) {} return j; }
function desenharRec() {
  const r = REC.find(x => x.id === $("rec").value); if (!r) return;
  $("rec-info").textContent = (r.disponivel ? "" : "Programa NÃO instalado neste servidor. ") + (r.entrada ? "Entrada: " + r.entrada.join(", ") : "Sem arquivo de entrada.");
  $("arq").disabled = !r.entrada; $("arq").accept = (r.entrada || []).join(",");
  $("ps").innerHTML = Object.entries(r.params).map(([k, v]) => Array.isArray(v)
    ? '<label for="p-' + k + '">' + esc(k) + '</label><select id="p-' + k + '" data-p="' + k + '">' + v.map(o => "<option>" + esc(o) + "</option>").join("") + "</select>"
    : '<label for="p-' + k + '">' + esc(k) + " (" + v.min + " a " + v.max + ')</label><input id="p-' + k + '" data-p="' + k + '" inputmode="decimal">').join("");
}
async function carregar() {
  const j = await api("/api/programas"); if (!j.ok) { $("trab").innerHTML = "<p class='erro'>" + esc(j.erro || "sem acesso") + "</p>"; return; }
  if (!REC.length) { REC = j.receitas; $("rec").innerHTML = REC.map(r => '<option value="' + r.id + '">' + esc(r.nome) + (r.disponivel ? "" : " (não instalado)") + "</option>").join(""); desenharRec(); }
  $("trab").innerHTML = j.trabalhos.length ? "<table><thead><tr><th scope='col'>Trabalho</th><th scope='col'>Receita</th><th scope='col'>Situação</th></tr></thead><tbody>"
    + j.trabalhos.map(t => '<tr><td><button class="botao" type="button" data-ver="' + t.id + '">' + esc(t.id) + "</button></td><td>" + esc(t.receita) + "</td><td>" + esc(t.estado) + "</td></tr>").join("") + "</tbody></table>" : "<p>Nenhum trabalho ainda.</p>";
}
async function ver(id) {
  const j = await api("/api/programas/trabalho/" + id); const d = $("det"); d.hidden = false;
  d.innerHTML = "<h2>Trabalho " + esc(id) + " · " + esc(j.estado) + "</h2>" + (j.erro ? "<p class='erro'>" + esc(j.erro) + "</p>" : "")
    + (j.resumo ? "<h3>Resumo</h3><pre>" + esc(JSON.stringify(j.resumo, null, 1)) + "</pre>" : "")
    + "<h3>Arquivos</h3><ul>" + (j.arquivos || []).map(a => '<li><a href="/api/programas/trabalho/' + id + "/arquivo/" + encodeURIComponent(a.nome) + '">' + esc(a.nome) + "</a> · " + a.kb + " kB</li>").join("") + "</ul>";
  if (j.estado === "rodando") setTimeout(() => ver(id), 3000); else carregar();
}
$("rec").onchange = desenharRec;
$("f").onsubmit = async ev => {
  ev.preventDefault(); const r = REC.find(x => x.id === $("rec").value), f = $("arq").files[0], p = {};
  document.querySelectorAll("[data-p]").forEach(e => { if (e.value !== "") p[e.dataset.p] = e.value; });
  if (r.entrada && !f) { $("msg").textContent = "Escolha o arquivo."; return; }
  if (!csrf) { try { csrf = (await api("/api/instancia")).csrf || ""; } catch (e) { csrf = ""; } }
  $("msg").textContent = "Enviando…";
  const j = await api("/api/programas/" + r.id + "?nome=" + encodeURIComponent(f ? f.name : "") + "&p=" + encodeURIComponent(JSON.stringify(p)),
    { method: "POST", body: f || new Blob([]), headers: Object.assign({ "Content-Type": "application/octet-stream" }, csrf ? { "X-Physis-CSRF": csrf } : {}) });
  $("msg").textContent = j.ok ? "Rodando: " + j.id : (j.erro || "Não rodou."); $("msg").className = j.ok ? "" : "erro";
  if (j.ok) ver(j.id);
};
document.addEventListener("click", ev => { const b = ev.target.closest && ev.target.closest("[data-ver]"); if (b) ver(b.dataset.ver); });
carregar();
</script>
<script id="physis-preferencias">
/* physis-preferencias.js v3 · Preferências de leitura e acessibilidade das telas da Physis

   Modo de conforto (neurodivergência: autismo, TDAH, dislexia): fundo verde, texto maior, mais espaçamento, menos estímulo,
   foco reforçado, fonte para dislexia, régua de leitura, leitura simplificada, lembrar onde parei.
   Acessibilidade (PcD): cegueira e baixa visão (leitores de tela, ouvir esta tela, alto contraste, zoom, atalhos),
   surdez (alertas visuais, Libras, legendas), fala (comunicação alternativa · CAA), mobilidade (teclado, comandos de voz).

   ORIGINAL ÚNICO: sistema/physis-preferencias.js (desde a v3 a antiga barra px-preferencias da plataforma, da Gestão e do
   SCADA é esta mesma, pela porta PxPref, no fim do arquivo). As telas são arquivos únicos, então cada uma leva uma CÓPIA IGUAL
   dentro do bloco script de id "physis-preferencias" (o arquivo inteiro, sem mudar nada). Quem copia é ferramentas/sincronizar.py
   (BLOCOS): physis-hub/web/painel.html, sistema/gestao-interna-physis.html, sistema/physis-scada-demo.html,
   physis-hub/web/consultoria.html, sistema/SustainKit_Definitivo.html, modulos/planejador/planejador-physis.html (e as demos
   geradas delas). O teste physis-hub/tests/test_preferencias.py confere que as cópias são iguais a este arquivo.

   Uso, uma vez por página, depois do conteúdo:
     PhysisPreferencias.iniciar({
       chave: "physis-pref",              // guardado no navegador; a mesma chave em todas as telas = a escolha acompanha a pessoa
       dicionario: { "Texto em português": "English text" },
       padroes: [[/^Pedido (\S+) recebido\.$/, "Request $1 received."]],   // textos montados na hora
       fragmentos: { "Captação de": "Harvesting of" },  // pedaços de textos montados com números ("Captação de " + n + " L")
       excecoes: ["Physis Engineering"],  // nomes próprios: iguais nas duas línguas
       ondeColocar: "#pp-lugar",          // elemento ou seletor onde a barra aparece (sem ele: início do <body>)
       variante: "sobre-verde",           // opcional: barra sobre fundo verde-escuro
       escalaPorZoom: true,               // texto maior por zoom (telas em px); false = a página usa var(--pp-escala)
       conteudo: "#conteudo",             // Alt+1, "Pular para o conteúdo" e "Ouvir esta tela"
       menu: "nav",                       // Alt+2
       busca: "[role=tablist]",           // Alt+3
       contato: "#f-desc",                // campo onde a CAA escreve quando nenhum campo está em uso
       relatar: "#contato",               // "Relatar barreira" sem abrirJuridico(): link do contato
       lembrar: { salvar: function () { return {}; }, restaurar: function (o) {} },  // opcional: aba aberta etc.
       esconderEmQuadro: true,            // aberta num quadro (iframe) da plataforma ou com html[data-em-quadro]: sem barra própria, segue a escolha de lá
       idiomaExterno: { atual, definir }, // tela que se traduz sozinha (o módulo só pede a troca; não traduz o DOM)
       suporte: function (frase) {},      // CAA sem campo em uso: leva a frase ao suporte da tela
       tela: "nome",                      // chave do "lembrar onde parei" (padrão: o endereço)
       aoMudar: function (estado) {}      // chamado depois de cada mudança
     });

   No <html>: data-tema="claro|escuro" (o que vale), data-tema-escolha="claro|escuro|auto", lang, a variável --pp-escala
   (1, 1.15 ou 1.3) e as classes physis-conforto, a11y-verde, a11y-texto-1 / a11y-texto-2, a11y-espaco, a11y-calma,
   a11y-foco, a11y-dislexia, a11y-regua, a11y-simples, a11y-contraste.
   Cada página define as próprias cores em html[data-tema="escuro"] e html.a11y-verde (os nomes das variáveis mudam de
   uma tela para outra) e o que some em html.a11y-simples (ou marca elementos com data-pp-secundario).
   Sem recurso de fora, sem avaliação de código: funciona com a Content-Security-Policy do servidor e sem internet.
   Comandos de voz usam o reconhecimento do navegador (no Chrome o áudio vai aos servidores do Google): começam desligados.

   Inglês: troca os textos (nós de texto e aria-label, title, placeholder, alt, label e value de botões) pelo par do
   dicionário, guarda o original para voltar ao português e acompanha o conteúdo novo (MutationObserver).
   O que não tem par fica em português e entra em PhysisPreferencias.faltando().
   Elementos com data-pp-manter (ou translate="no") não são traduzidos.

   Cores (versão de teste, 20/11/2026): guia de identidade Physis, PALETA.md "Tipos de tela". Claro = tipo B (creme, carvão,
   floresta #1A4D2E em contornos e links, botão principal #C2410C com texto branco); escuro = tipo A (verde profundo #0B3D2E,
   cartões #0F4535, linhas #2F5E4E, texto #F4F1EA, destaque pequeno #D9A58C). Foco e régua em terracota, nunca em azul. */
